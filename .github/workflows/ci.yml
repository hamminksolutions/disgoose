name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  checks:
    name: Lint, typecheck, and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npx tsc --noEmit

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - run: supabase start

      # Unit tests hit a real local Supabase instance (see vitest.config.ts,
      # which loads .env.test — not committed, since these values already
      # come from the running instance and don't need duplicating in a file).
      - name: Export local Supabase credentials
        run: |
          STATUS=$(supabase status -o json)
          echo "SUPABASE_URL=$(echo "$STATUS" | jq -r .API_URL)" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$(echo "$STATUS" | jq -r .SERVICE_ROLE_KEY)" >> "$GITHUB_ENV"

      - run: npm test

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - run: supabase start

      # e2e drives the real Next dev server (playwright.config.ts's
      # webServer), which needs these at runtime the same way `npm run dev`
      # does locally via .env.local (see .env.example) — not just the two
      # service-role vars the checks job above exports for vitest.
      - name: Export local Supabase credentials
        run: |
          STATUS=$(supabase status -o json)
          echo "SUPABASE_URL=$(echo "$STATUS" | jq -r .API_URL)" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$(echo "$STATUS" | jq -r .SERVICE_ROLE_KEY)" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_URL=$(echo "$STATUS" | jq -r .API_URL)" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(echo "$STATUS" | jq -r .ANON_KEY)" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SITE_URL=http://127.0.0.1:3000" >> "$GITHUB_ENV"

      - run: npm run test:e2e
